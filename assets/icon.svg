<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Meta-Stripper icon</title>
  <desc id="desc">Neon silhouette of an adult pole dancer with one arm raised and legs apart</desc>

  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="72%">
      <stop offset="0" stop-color="#3a103d"/>
      <stop offset=".58" stop-color="#18081b"/>
      <stop offset="1" stop-color="#08040a"/>
    </radialGradient>

    <linearGradient id="woman" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff91cb"/>
      <stop offset=".42" stop-color="#ff3a9d"/>
      <stop offset="1" stop-color="#d60072"/>
    </linearGradient>

    <linearGradient id="pole" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1b7f8c"/>
      <stop offset=".48" stop-color="#d8ffff"/>
      <stop offset="1" stop-color="#49e9f5"/>
    </linearGradient>

    <filter id="pinkGlow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="cyanGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="256" cy="256" r="232" fill="url(#bg)" stroke="#ff3a9d" stroke-width="13"/>
  <circle cx="256" cy="256" r="199" fill="none" stroke="#55e7f1" stroke-width="4" opacity=".55"/>

  <g filter="url(#cyanGlow)">
    <rect x="247" y="58" width="18" height="394" rx="9" fill="url(#pole)"/>
    <ellipse cx="256" cy="451" rx="42" ry="6" fill="#55e7f1" opacity=".34"/>
  </g>

  <g filter="url(#pinkGlow)" fill="url(#woman)">
    <!-- raised arm -->
    <path d="M245 187
             C232 170 226 151 228 130
             L233 79
             C234 67 242 59 252 60
             C261 61 267 69 266 80
             L261 133
             C259 155 264 173 274 188
             Z"/>

    <!-- hair -->
    <path d="M277 104
             C303 105 321 126 318 151
             C316 168 307 180 294 187
             C307 192 319 205 319 221
             C302 216 288 208 279 197
             C263 197 247 189 238 176
             C228 161 228 142 236 127
             C244 111 259 103 277 104Z"/>

    <!-- face and neck silhouette -->
    <path d="M263 119
             C276 111 294 115 302 128
             C310 141 307 158 296 168
             C288 175 278 178 268 174
             C260 170 255 162 254 153
             C253 140 256 127 263 119Z"/>
    <path d="M267 169
             C267 183 262 193 253 199
             L286 202
             C278 193 277 182 281 171Z"/>

    <!-- torso with clear chest, waist and hips -->
    <path d="M246 194
             C227 198 213 211 208 229
             C204 244 207 257 216 267
             C225 278 228 289 224 302
             C221 313 215 324 215 337
             C215 354 225 369 241 379
             C257 388 281 390 299 381
             C317 372 328 356 328 339
             C328 325 320 314 316 302
             C312 290 315 278 324 268
             C333 257 336 243 331 228
             C326 211 311 199 291 195
             C276 192 261 192 246 194Z"/>

    <!-- free arm on hip -->
    <path d="M318 221
             C333 235 341 252 340 271
             C339 286 332 299 320 309
             C310 318 300 322 292 319
             C284 316 282 308 287 301
             C293 294 302 290 307 283
             C315 273 317 258 311 244Z"/>

    <!-- left leg -->
    <path d="M244 369
             C228 385 211 404 194 430
             C185 444 176 453 164 455
             C151 458 141 450 143 440
             C145 432 153 424 160 416
             C178 395 194 377 210 360Z"/>

    <!-- right leg -->
    <path d="M296 371
             C313 386 332 404 350 429
             C359 442 368 451 380 454
             C392 457 403 450 401 440
             C399 431 391 423 384 415
             C365 393 349 375 332 358Z"/>

    <!-- heels -->
    <path d="M138 448 L170 448 L180 459 L136 459Z"/>
    <path d="M374 450 L404 450 L414 459 L372 459Z"/>
  </g>

  <!-- neon edge accents -->
  <g fill="none" stroke-linecap="round">
    <path d="M246 196 C226 205 217 224 218 244" stroke="#ffb5dc" stroke-width="4" opacity=".7"/>
    <path d="M294 197 C315 207 324 225 323 245" stroke="#ff73b8" stroke-width="4" opacity=".75"/>
    <path d="M230 329 C245 342 283 344 310 329" stroke="#ff9acb" stroke-width="4" opacity=".72"/>
    <path d="M256 72 L256 439" stroke="#e8ffff" stroke-width="3" opacity=".75"/>
  </g>
</svg>
