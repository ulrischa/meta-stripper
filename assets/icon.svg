<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Meta-Stripper icon</title>
  <desc id="desc">Stylized adult pole dancer seen from behind in a deep crouch, looking back over her shoulder</desc>

  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="72%">
      <stop offset="0" stop-color="#4a1046"/>
      <stop offset=".55" stop-color="#1d0a20"/>
      <stop offset="1" stop-color="#08040a"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe1d1"/>
      <stop offset=".38" stop-color="#efae94"/>
      <stop offset=".72" stop-color="#c97874"/>
      <stop offset="1" stop-color="#8e405f"/>
    </linearGradient>
    <linearGradient id="skinLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0df"/>
      <stop offset="1" stop-color="#e6a58d"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171019"/>
      <stop offset=".55" stop-color="#351328"/>
      <stop offset="1" stop-color="#751245"/>
    </linearGradient>
    <linearGradient id="outfit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff63b3"/>
      <stop offset=".45" stop-color="#e1127b"/>
      <stop offset="1" stop-color="#7d0a53"/>
    </linearGradient>
    <linearGradient id="pole" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e7d8b"/>
      <stop offset=".45" stop-color="#b9fbff"/>
      <stop offset="1" stop-color="#35c8d8"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>

  <circle cx="256" cy="256" r="232" fill="url(#bg)" stroke="#ff3c9d" stroke-width="13"/>
  <circle cx="256" cy="256" r="198" fill="none" stroke="#53e5f1" stroke-width="4" opacity=".58"/>
  <ellipse cx="257" cy="431" rx="142" ry="22" fill="#000" opacity=".28"/>

  <g filter="url(#glow)">
    <rect x="354" y="62" width="16" height="392" rx="8" fill="url(#pole)"/>
  </g>

  <g filter="url(#shadow)" stroke="#351426" stroke-linejoin="round" stroke-linecap="round">
    <!-- Hair mass -->
    <path d="M226 123
             C224 94 247 76 275 78
             C303 80 322 101 319 129
             C318 141 313 151 307 161
             C322 171 333 188 331 207
             C315 199 302 191 292 178
             C277 187 251 184 236 170
             C224 159 218 141 226 123Z"
          fill="url(#hair)" stroke-width="6"/>

    <!-- Face turned back -->
    <path d="M258 103
             C274 94 296 99 306 114
             C314 127 312 145 302 157
             C293 168 279 173 266 168
             C254 164 247 153 246 140
             C245 126 249 111 258 103Z"
          fill="url(#skinLight)" stroke-width="5"/>
    <path d="M294 115 C302 116 307 121 309 128" fill="none" stroke-width="3"/>
    <path d="M297 128 C301 126 305 126 308 129" fill="none" stroke-width="2.7"/>
    <circle cx="304" cy="129" r="2" fill="#24151b" stroke="none"/>
    <path d="M307 137 C311 140 311 144 307 146" fill="none" stroke-width="2.4"/>
    <path d="M298 154 C302 157 307 157 311 154" fill="none" stroke="#9d2858" stroke-width="2.5"/>
    <path d="M263 107 C279 99 291 101 300 109" fill="none" stroke="#6b183e" stroke-width="5"/>

    <!-- Neck -->
    <path d="M258 166 C259 181 254 189 243 196 L278 199 C268 188 269 178 272 167Z"
          fill="url(#skin)" stroke-width="5"/>

    <!-- Back, waist, hips from behind -->
    <path d="M236 190
             C217 197 206 212 205 230
             C204 248 213 264 211 280
             C209 298 196 311 198 330
             C200 349 215 364 236 371
             C252 377 273 378 290 371
             C313 362 329 344 329 325
             C330 307 318 294 315 278
             C312 261 321 245 318 227
             C315 210 301 196 282 191
             C267 187 250 187 236 190Z"
          fill="url(#skin)" stroke-width="6"/>

    <!-- Shoulder blade and spine shading -->
    <path d="M244 202 C234 218 232 237 237 252" fill="none" stroke="#b86469" stroke-width="4" opacity=".75"/>
    <path d="M283 202 C294 217 297 235 292 252" fill="none" stroke="#b86469" stroke-width="4" opacity=".75"/>
    <path d="M264 199 C260 224 259 251 261 283 C262 301 262 316 258 331" fill="none" stroke="#9b5161" stroke-width="3.2" opacity=".75"/>
    <path d="M227 274 C242 284 278 287 302 275" fill="none" stroke="#e2a086" stroke-width="3" opacity=".55"/>

    <!-- Cropped top seen from behind -->
    <path d="M222 207
             C235 218 248 223 263 223
             C279 223 293 217 304 206
             L307 230
             C295 239 281 244 263 244
             C245 244 231 239 219 231Z"
          fill="url(#outfit)" stroke-width="5"/>
    <path d="M230 196 L220 216 M294 196 L304 216" fill="none" stroke="#f44a9f" stroke-width="7"/>
    <path d="M241 226 C254 232 274 232 288 226" fill="none" stroke="#ff9acb" stroke-width="3" opacity=".65"/>

    <!-- High cut bottoms -->
    <path d="M204 318
             C221 329 240 334 260 334
             C283 334 307 328 325 315
             L329 336
             C320 358 298 373 271 378
             C244 381 219 371 205 354
             C199 347 197 337 204 318Z"
          fill="url(#outfit)" stroke-width="5"/>
    <path d="M209 326 C236 339 295 339 323 324" fill="none" stroke="#ff95c7" stroke-width="3.5" opacity=".8"/>

    <!-- Right arm reaching to pole -->
    <path d="M301 205
             C318 195 332 180 343 160
             C349 149 354 135 359 119"
          fill="none" stroke="url(#skin)" stroke-width="24"/>
    <path d="M358 121 C356 111 358 101 363 94" fill="none" stroke="url(#skinLight)" stroke-width="13"/>
    <path d="M363 94 C368 98 371 106 369 115" fill="none" stroke="url(#skinLight)" stroke-width="8"/>

    <!-- Left arm bracing lower on pole -->
    <path d="M219 216
             C200 239 197 269 207 291
             C218 315 241 324 267 323
             C300 322 329 310 352 291"
          fill="none" stroke="url(#skin)" stroke-width="22"/>
    <path d="M349 292 C355 288 360 286 365 287" fill="none" stroke="url(#skinLight)" stroke-width="11"/>

    <!-- Left thigh in deep squat -->
    <path d="M233 361
             C205 365 181 378 162 399
             C151 411 143 425 139 439"
          fill="none" stroke="url(#skin)" stroke-width="42"/>
    <!-- Left lower leg -->
    <path d="M144 431 C137 440 132 447 124 451" fill="none" stroke="url(#skin)" stroke-width="26"/>

    <!-- Right thigh in deep squat -->
    <path d="M292 362
             C320 367 342 381 356 401
             C364 412 366 425 361 439"
          fill="none" stroke="url(#skin)" stroke-width="42"/>
    <!-- Right lower leg -->
    <path d="M361 432 C359 440 359 447 361 453" fill="none" stroke="url(#skin)" stroke-width="25"/>

    <!-- Leg contour highlights -->
    <path d="M215 374 C191 383 174 397 161 414" fill="none" stroke="#f6c7af" stroke-width="5" opacity=".6"/>
    <path d="M310 375 C329 383 343 394 352 408" fill="none" stroke="#f6c7af" stroke-width="5" opacity=".6"/>

    <!-- Heels -->
    <path d="M113 449 L145 449 L155 458 L111 458Z" fill="#e6167b" stroke-width="4"/>
    <path d="M349 451 L374 451 L382 460 L348 460Z" fill="#e6167b" stroke-width="4"/>
    <path d="M376 458 L383 469" fill="none" stroke="#e6167b" stroke-width="5"/>

    <!-- Hair strands and earring -->
    <path d="M232 117 C224 137 228 157 243 174" fill="none" stroke="#8f1c52" stroke-width="5"/>
    <path d="M314 137 C329 151 334 171 330 188" fill="none" stroke="#8f1c52" stroke-width="5"/>
    <circle cx="304" cy="158" r="5" fill="#6ef1fa" stroke="#15363b" stroke-width="2"/>
  </g>

  <!-- Graphic cel highlights -->
  <path d="M246 201 C239 218 238 236 242 249" fill="none" stroke="#ffe4d5" stroke-width="4" stroke-linecap="round" opacity=".48"/>
  <path d="M216 318 C229 326 244 329 258 329" fill="none" stroke="#ffc2db" stroke-width="3" stroke-linecap="round" opacity=".5"/>
  <path d="M357 79 L357 433" stroke="#d9ffff" stroke-width="3" stroke-linecap="round" opacity=".72"/>
</svg>
