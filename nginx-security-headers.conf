# Example Nginx headers for Meta-Stripper.
# Copy these directives into the HTTPS server block that serves the app.
# Do not blindly add includeSubDomains or preload to HSTS.

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; frame-ancestors 'none'; worker-src 'self'; manifest-src 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=()" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Strict-Transport-Security "max-age=31536000" always;

# `expires` is used instead of a nested `add_header` so the security
# add_header directives above remain inherited in these locations.
location = /sw.js {
    expires -1;
    try_files $uri =404;
}

location = /manifest.webmanifest {
    default_type application/manifest+json;
    expires -1;
    try_files $uri =404;
}
